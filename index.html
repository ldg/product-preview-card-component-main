<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->

		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./images/favicon-32x32.png"
		/>

		<title>Frontend Mentor | Product preview card component</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/styles.css" />
	</head>
	<body>
		<main class="main">
			<section class="card">
				<header>
					<picture>
						<source
							srcset="./images/image-product-desktop.jpg"
							media="(min-width: 600px)"
						/>
						<img
							class="card__image"
							src="./images/image-product-mobile.jpg"
							alt="Gabrielle Essence Eau De Parfum"
						/>
					</picture>
				</header>
				<div class="card__content">
					<p class="card__category">Perfume</p>
					<h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
					<p class="card__description">
						A floral, solar and voluptuous interpretation composed by Olivier
						Polge, Perfumer-Creator for the House of CHANEL.
					</p>
					<p class="card__price">
						$149.99 <span class="regular-price">$169.99</span>
					</p>
					<button
						name="addtocart"
						class="card__button"
						type="button"
						role="button"
					>
						Add to Cart
					</button>
				</div>
			</section>
		</main>

		<footer class="footer">
			<div class="attribution">
				Challenge by
				<a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
					>Frontend Mentor</a
				>. Coded by
				<a href="https://frontendmentor.io/profile/ldg">Scott McIntire</a>.
			</div>
		</footer>
	</body>
</html>
